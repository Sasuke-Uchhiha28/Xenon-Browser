# Blink host CI (Milestone M1.4, sub-step 3).
#
# Builds, on Windows and Linux:
#   1. the shared UI (desktop/ui) — served over xenon://ui at runtime,
#   2. the Xenon core (desktop/core, cargo release) — the encrypted
#      database + JSON-RPC service spawned as a child process,
#   3. the Xenon host (desktop/blink/app) against the pinned CEF
#      distribution,
# and then runs the host's --check-core smoke test: it spawns the freshly
# built core, performs the JSON-RPC handshake and a settings round trip
# through a real SQLCipher database, headless. The bundle (host + core +
# UI + CEF runtime) is uploaded as a runnable artifact. The pinned CEF
# version and SHA-1 live in desktop/tools/fetch-cef.py; the CEF tree is
# never committed (ENG-05) and lands in the git-ignored desktop/blink/cef/.

name: blink

on:
  push:
    paths:
      - ".github/workflows/blink.yml"
      - "desktop/tools/fetch-cef.py"
      - "desktop/tools/stage-blink.py"
      - "desktop/blink/**"
      - "desktop/ui/**"
      - "desktop/core/**"
  pull_request:
    paths:
      - ".github/workflows/blink.yml"
      - "desktop/tools/fetch-cef.py"
      - "desktop/tools/stage-blink.py"
      - "desktop/blink/**"
      - "desktop/ui/**"
      - "desktop/core/**"

permissions:
  contents: read

jobs:
  blink-linux:
    name: Xenon Blink host — Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Development headers the host links against.
      - name: Install CEF build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libxrender-dev \
            libxshmfence-dev libxtst-dev libgbm-dev libxkbcommon-dev \
            libnss3-dev libasound2-dev libatk1.0-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libpango1.0-dev libcairo2-dev \
            libglib2.0-dev libudev-dev
      - name: Set up Node.js for the shared UI build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Install UI dependencies and build
        run: |
          npm ci --prefix desktop/ui
          npm run build --prefix desktop/ui
      - name: Build the Xenon core (release)
        run: cargo build --release --manifest-path desktop/core/Cargo.toml -p xenon-core
      - name: Download, verify and extract the pinned CEF distribution
        run: python3 desktop/tools/fetch-cef.py --platform linux64
      - name: Stage the Xenon host into the CEF tree
        run: python3 desktop/tools/stage-blink.py --platform linux64
      - name: Configure and build the Xenon host
        run: |
          cmake -S desktop/blink/cef/linux64 -B desktop/blink/cef/linux64/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/blink/cef/linux64/build \
            --config Release --target xenon-blink --parallel 4
      - name: Bundle the core and UI into the host output
        run: |
          cmake -E copy desktop/core/target/release/xenon-core \
            desktop/blink/cef/linux64/build/tests/xenon/Release/xenon-core
          cmake -E copy_directory desktop/ui/dist \
            desktop/blink/cef/linux64/build/tests/xenon/Release/ui
      - name: Core smoke test (spawn + JSON-RPC round trip)
        run: |
          cd desktop/blink/cef/linux64/build/tests/xenon/Release
          ./xenon-blink --check-core
      - name: Upload the runnable host bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xenon-blink-linux64
          path: desktop/blink/cef/linux64/build/tests/xenon/Release/
          if-no-files-found: error

  blink-windows:
    name: Xenon Blink host — Windows
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js for the shared UI build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Install UI dependencies and build
        run: |
          npm ci --prefix desktop/ui
          npm run build --prefix desktop/ui
      - name: Build the Xenon core (release)
        run: cargo build --release --manifest-path desktop/core/Cargo.toml -p xenon-core
      - name: Download, verify and extract the pinned CEF distribution
        run: python desktop/tools/fetch-cef.py --platform windows64
      - name: Stage the Xenon host into the CEF tree
        run: python desktop/tools/stage-blink.py --platform windows64
      - name: Configure and build the Xenon host
        run: |
          cmake -S desktop/blink/cef/windows64 -B desktop/blink/cef/windows64/build
          cmake --build desktop/blink/cef/windows64/build `
            --config Release --target xenon-blink
      - name: Bundle the core and UI into the host output
        run: |
          cmake -E copy desktop/core/target/release/xenon-core.exe `
            desktop/blink/cef/windows64/build/tests/xenon/Release/xenon-core.exe
          cmake -E copy_directory desktop/ui/dist `
            desktop/blink/cef/windows64/build/tests/xenon/Release/ui
      - name: Core smoke test (spawn + JSON-RPC round trip)
        run: |
          cd desktop/blink/cef/windows64/build/tests/xenon/Release
          .\xenon-blink.exe --check-core
      - name: Upload the runnable host bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xenon-blink-windows64
          path: desktop/blink/cef/windows64/build/tests/xenon/Release/
          if-no-files-found: error
