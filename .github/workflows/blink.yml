# Blink host CI (Milestone M1.4, sub-step 1).
#
# Proves the CEF toolchain on Windows and Linux by building the
# UNMODIFIED CEF sample application (cefsimple) from the pinned CEF
# binary distribution. Nothing here is Xenon code yet; that starts in
# sub-step 2. The pinned version and its SHA-1 live in
# desktop/tools/fetch-cef.py; the extracted tree is never committed
# (ENG-05) and lands in the git-ignored desktop/blink/cef/ folder.

name: blink

on:
  push:
    paths:
      - ".github/workflows/blink.yml"
      - "desktop/tools/fetch-cef.py"
      - "desktop/blink/**"
  pull_request:
    paths:
      - ".github/workflows/blink.yml"
      - "desktop/tools/fetch-cef.py"
      - "desktop/blink/**"

permissions:
  contents: read

jobs:
  blink-linux:
    name: CEF sample build — Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Development headers cefsimple links against (X11, GBM, NSS, audio).
      - name: Install CEF build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libxrender-dev \
            libxshmfence-dev libxtst-dev libgbm-dev libxkbcommon-dev \
            libnss3-dev libasound2-dev libatk1.0-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libpango1.0-dev libcairo2-dev \
            libglib2.0-dev libudev-dev
      - name: Download, verify and extract the pinned CEF distribution
        run: python3 desktop/tools/fetch-cef.py --platform linux64
      - name: Configure and build the unmodified cefsimple sample
        run: |
          cmake -S desktop/blink/cef/linux64 -B desktop/blink/cef/linux64/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/blink/cef/linux64/build \
            --config Release --target cefsimple --parallel 4
      - name: Report cefsimple output locations
        if: always()
        run: |
          find desktop/blink/cef/linux64/build -maxdepth 5 \( -name "cefsimple*" -o -name "libcef.so" \) 2>/dev/null | head -20 | while IFS= read -r line; do echo "::error::linux output: $line"; done
      - name: Upload the built sample as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cefsimple-linux64
          path: |
            desktop/blink/cef/linux64/build/cefsimple/
            !**/CMakeFiles/**
          if-no-files-found: warn

  blink-windows:
    name: CEF sample build — Windows
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download, verify and extract the pinned CEF distribution
        run: python desktop/tools/fetch-cef.py --platform windows64
      - name: Configure and build the unmodified cefsimple sample
        run: |
          cmake -S desktop/blink/cef/windows64 -B desktop/blink/cef/windows64/build
          cmake --build desktop/blink/cef/windows64/build `
            --config Release --target cefsimple
      - name: Report cefsimple output locations
        if: always()
        run: |
          Get-ChildItem -Path desktop/blink/cef/windows64/build -Recurse -Depth 4 -Include "cefsimple*","libcef.dll" -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty FullName | ForEach-Object { Write-Output "::error::windows output: $_" }
      - name: Upload the built sample as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cefsimple-windows64
          path: desktop/blink/cef/windows64/build/cefsimple/Release/
          if-no-files-found: warn
