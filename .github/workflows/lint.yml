# Lint-only CI workflow (Milestone M1.1).
#
# Runs the same three checks as the local pre-commit hook, plus a Python
# style check (ruff) for the tools themselves. No compilation, no engine
# builds: engine builds come in later milestones (M1.4, M1.5).
#
# Why Ubuntu only: every check here is plain Python and platform
# independent, so a second OS would double the minutes for no coverage.

name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and repository checks
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA; the comment names the release tag.
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11 (minimum supported version)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned dev tools
        run: python -m pip install -r desktop/tools/requirements-dev.txt
      - name: Style-check the Python tools (ruff)
        run: python -m ruff check desktop/tools
      - name: Scan for committed secrets (PRIV-09)
        run: python desktop/tools/check-secrets.py
      - name: Check for URL logging (PRIV-05)
        run: python desktop/tools/check-no-url-logging.py
      - name: Check file length limit of 300 lines (Rules.md 4.1)
        run: python desktop/tools/check-file-length.py
