# CI workflows for the Xenon desktop repository.
#
# Job 1 "lint": the repository checks — Python tools style plus the three
# pre-commit checks (secrets, URL logging, file length). Fast, no build.
# Job 2 "ui": the shared UI — typecheck, build, component tests, and the
# automated zero-external-requests check (Design.md 4.1). No engine builds:
# those come with the host milestones (M1.4, M1.5) and run separately.

name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and repository checks
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA; the comment names the release tag.
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11 (minimum supported version)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned dev tools
        run: python -m pip install -r desktop/tools/requirements-dev.txt
      - name: Style-check the Python tools (ruff)
        run: python -m ruff check desktop/tools
      - name: Scan for committed secrets (PRIV-09)
        run: python desktop/tools/check-secrets.py
      - name: Check for URL logging (PRIV-05)
        run: python desktop/tools/check-no-url-logging.py
      - name: Check file length limit of 300 lines (Rules.md 4.1)
        run: python desktop/tools/check-file-length.py

  ui:
    name: Shared UI — build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/ui
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Install exact dependencies from the lock file
        run: npm ci
      - name: Typecheck, then build with build-time Tailwind
        run: npm run build
      - name: Component, bridge and store tests
        run: npm test
      - name: Zero external requests in the built output (Design.md 4.1)
        run: npm run check:no-external
